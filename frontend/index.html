<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartQ - Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fx.css">
    <link rel="stylesheet" href="theme.css">

</head>

<body data-page="auth">

    <main class="auth-page">

        <div class="auth-wrapper">

            <div class="brand">

                <div class="brand-mark">
                    Q
                </div>

                <div>
                    <div class="brand-name">
                        SmartQ
                    </div>

                    <div class="brand-tagline">
                        Smart Queue Management
                    </div>
                </div>

            </div>


            <div class="auth-card">

                <div class="tabs">

                    <button
                        id="loginTab"
                        class="tab active"
                        onclick="showLogin()">
                        Login
                    </button>

                    <button
                        id="registerTab"
                        class="tab"
                        onclick="showRegister()">
                        Register
                    </button>

                </div>


                <!-- LOGIN -->

                <div id="loginBox">

                    <h2 class="auth-title">
                        Welcome back
                    </h2>

                    <p class="auth-subtitle">
                        Login to manage your appointments and queue.
                    </p>


                    <form id="loginForm">

                        <div class="form-group">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter password"
                                required>

                        </div>


                        <button
                            class="btn btn-primary btn-full"
                            type="submit">

                            Login

                        </button>

                    </form>

                    <a href="#" class="forgot-link"
                       onclick="showForgot(); return false;">
                        Forgot password?
                    </a>
                </div>


                <!-- REGISTER -->

                <div id="registerBox" class="hidden">

                    <h2 class="auth-title">
                        Create account
                    </h2>

                    <p class="auth-subtitle">
                        Register as a SmartQ customer.
                    </p>


                    <form id="registerForm">

                        <div class="form-group">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your name"
                                required>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter email"
                                required>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create password"
                                required>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Register as
                            </label>

                            <select id="registerRole"
                                    onchange="toggleCode()">

                                <option value="customer">Customer</option>
                                <option value="staff">Staff</option>
                                <option value="admin">Admin</option>

                            </select>

                        </div>


                        <div class="form-group hidden"
                             id="orgGroup">

                            <label class="form-label">
                                Business / Clinic Name
                            </label>

                            <input
                                type="text"
                                id="registerOrg"
                                placeholder="e.g. Dr. Rao's Clinic">

                        </div>


                        <div class="form-group hidden"
                             id="codeGroup">

                            <label class="form-label"
                                   id="codeLabel">
                                Staff Code
                            </label>

                            <input
                                type="text"
                                id="registerCode"
                                autocomplete="off"
                                placeholder="Code given by your admin">

                        </div>


                        <button
                            class="btn btn-primary btn-full"
                            type="submit">

                            Create Account

                        </button>

                    </form>

                </div>

                <!-- FORGOT PASSWORD -->

                <div id="forgotBox" class="hidden">

                    <h2 class="auth-title">
                        Reset password
                    </h2>

                    <p class="auth-subtitle"
                       id="forgotHint">
                        Enter your registered email to get a reset code.
                    </p>


                    <form id="forgotForm">

                        <div class="form-group">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="forgotEmail"
                                placeholder="Enter your registered email"
                                required>

                        </div>


                        <div id="resetFields" class="hidden">

                            <div class="form-group">

                                <label class="form-label">
                                    Reset Code
                                </label>

                                <input
                                    type="text"
                                    id="resetCode"
                                    maxlength="6"
                                    placeholder="6-digit code">

                            </div>


                            <div class="form-group">

                                <label class="form-label">
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    id="resetPassword"
                                    placeholder="At least 6 characters">

                            </div>

                        </div>


                        <button
                            id="forgotBtn"
                            class="btn btn-primary btn-full"
                            type="submit">

                            Send Reset Code

                        </button>

                    </form>

                    <a href="#" class="forgot-link"
                       onclick="showLogin(); return false;">
                        &larr; Back to login
                    </a>

                </div>

            </div>


            <div class="footer">
                © 2026 SmartQ
            </div>

        </div>

    </main>


    <script>

        function hideForgot() {

            document
                .getElementById("forgotBox")
                .classList.add("hidden");
        }


        function showForgot() {

            document
                .getElementById("loginBox")
                .classList.add("hidden");

            document
                .getElementById("registerBox")
                .classList.add("hidden");

            document
                .getElementById("forgotBox")
                .classList.remove("hidden");

            document
                .getElementById("loginTab")
                .classList.remove("active");

            document
                .getElementById("registerTab")
                .classList.remove("active");
        }


        function toggleCode() {

            const role =
                document.getElementById("registerRole").value;

            document
                .getElementById("orgGroup")
                .classList.toggle("hidden", role !== "admin");

            document
                .getElementById("codeGroup")
                .classList.toggle("hidden", role === "customer");

            document.getElementById("codeLabel").textContent =
                role === "admin" ? "Admin Invite Code" : "Staff Code";

            document.getElementById("registerCode").placeholder =
                role === "admin"
                    ? "Leave empty unless your site requires one"
                    : "Code given by your admin";
        }


        function showLogin() {

            hideForgot();

            document
                .getElementById("loginBox")
                .classList.remove("hidden");

            document
                .getElementById("registerBox")
                .classList.add("hidden");

            document
                .getElementById("loginTab")
                .classList.add("active");

            document
                .getElementById("registerTab")
                .classList.remove("active");
        }


        function showRegister() {

            hideForgot();

            document
                .getElementById("loginBox")
                .classList.add("hidden");

            document
                .getElementById("registerBox")
                .classList.remove("hidden");

            document
                .getElementById("loginTab")
                .classList.remove("active");

            document
                .getElementById("registerTab")
                .classList.add("active");
        }

    </script>


    <script src="app.js"></script>
    <script src="fx.js"></script>
    <script src="theme.js"></script>

</body>

</html>
