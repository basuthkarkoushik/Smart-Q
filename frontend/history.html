<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartQ - History</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fx.css">
    <link rel="stylesheet" href="theme.css">

</head>

<body data-page="history">

    <div id="navbar"></div>


    <main class="main">

        <div class="container">

            <h1 class="page-title">
                Appointment History
            </h1>

            <p class="page-subtitle">
                View all your previous appointments.
            </p>


            <div class="card">

                <div class="search-box">

                    <input
                        type="text"
                        id="historySearch"
                        placeholder="Search by service or token...">

                </div>


                <div id="historyList">

                </div>

            </div>

        </div>

    </main>


    <script src="app.js"></script>
    <script src="fx.js"></script>
    <script src="theme.js"></script>

</body>

</html>
